<!doctype html>
<html lang="rw">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BevoFilms Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./bevo-config.js"></script>
</head>
<body class="min-h-screen bg-slate-950 text-white p-4">
<main class="mx-auto max-w-xl space-y-5">
  <a href="./" class="text-rose-400 text-sm">← Garuka kuri BevoFilms</a>
  <h1 class="text-2xl font-black">BevoFilms Admin</h1>
  <p class="text-sm text-slate-400">Injiza film cyangwa episode. Video ibikwa muri Telegram private channel; amakuru yayo akabikwa muri Supabase.</p>
  <section id="authBox" class="rounded-xl border border-slate-800 bg-slate-900 p-4 space-y-3">
    <h2 class="font-bold">Admin login</h2>
    <input id="email" type="email" placeholder="Admin email" class="w-full rounded-lg bg-slate-800 p-3">
    <input id="password" type="password" placeholder="Password" class="w-full rounded-lg bg-slate-800 p-3">
    <button id="login" class="rounded-lg bg-rose-600 px-4 py-3 font-bold">Login</button>
    <button id="logout" class="ml-2 rounded-lg bg-slate-700 px-4 py-3">Logout</button>
    <p id="authStatus" class="text-sm text-slate-400"></p>
  </section>
  <form id="uploadForm" class="rounded-xl border border-slate-800 bg-slate-900 p-4 space-y-3">
    <h2 class="font-bold">Upload media</h2>
    <input id="title" required placeholder="Title / Izina rya film" class="w-full rounded-lg bg-slate-800 p-3">
    <select id="type" class="w-full rounded-lg bg-slate-800 p-3"><option value="movie">Movie</option><option value="series">Series</option></select>
    <input id="interpreter" placeholder="Umusobanuzi (urugero: Rocky Kimomo)" class="w-full rounded-lg bg-slate-800 p-3">
    <input id="image" type="url" placeholder="Poster Image URL" class="w-full rounded-lg bg-slate-800 p-3">
    <textarea id="description" placeholder="Description" class="w-full rounded-lg bg-slate-800 p-3"></textarea>
    <input id="video" type="file" accept="video/*" required class="w-full rounded-lg bg-slate-800 p-3">
    <p class="text-xs text-amber-300">Telegram Bot API standard upload limit is typically 20 MB per video. Keep uploads below this limit.</p>
    <button id="submit" class="w-full rounded-lg bg-rose-600 p-3 font-bold">Upload to Telegram & Publish</button>
    <p id="uploadStatus" class="text-sm text-slate-300"></p>
  </form>
</main>
<script>
const cfg = window.BEVO_CONFIG || {};
const ready = cfg.supabaseUrl && cfg.supabaseAnonKey &&
  !cfg.supabaseUrl.includes("YOUR_") && !cfg.supabaseAnonKey.includes("YOUR_");
const status = document.getElementById("authStatus");
const uploadStatus = document.getElementById("uploadStatus");
let sb;
if (ready) sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
else status.textContent = "Banza wuzuze Supabase URL na anon key muri bevo-config.js.";
document.getElementById("login").onclick = async () => {
  if (!sb) return;
  const {error} = await sb.auth.signInWithPassword({email:email.value,password:password.value});
  status.textContent = error ? error.message : "Winjiye nka admin.";
};
document.getElementById("logout").onclick = async () => {
  if (sb) await sb.auth.signOut();
  status.textContent = "Wasohotse.";
};
document.getElementById("uploadForm").onsubmit = async (ev) => {
  ev.preventDefault();
  if (!sb) return;
  const {data:{session}} = await sb.auth.getSession();
  if (!session) { uploadStatus.textContent = "Banza winjire nka admin."; return; }
  const file = document.getElementById("video").files[0];
  if (!file) return;
  if (file.size > 20 * 1024 * 1024) { uploadStatus.textContent = "Video irengeje 20 MB. Gabanya ingano yayo mbere yo kohereza."; return; }
  const btn = document.getElementById("submit"); btn.disabled = true;
  uploadStatus.textContent = "Video iri koherezwa kuri Telegram...";
  try {
    const fd = new FormData(); fd.append("video", file, file.name);
    const response = await fetch("/api/upload-to-telegram", {
      method:"POST", headers:{Authorization:"Bearer " + session.access_token}, body:fd
    });
    const result = await response.json();
    if (!response.ok || !result.file_id) throw new Error(result.error || "Telegram upload failed");
    uploadStatus.textContent = "Video yageze kuri Telegram. Iri kubikwa muri catalog...";
    const row = {
      title:document.getElementById("title").value.trim(),
      type:document.getElementById("type").value,
      interpreter_name:document.getElementById("interpreter").value.trim(),
      image_url:document.getElementById("image").value.trim() || null,
      description:document.getElementById("description").value.trim(),
      telegram_file_id:result.file_id,
      published:true
    };
    const {error} = await sb.from("bevo_media").insert(row);
    if (error) throw error;
    uploadStatus.textContent = "Byagenze neza! Media yasohotse kuri BevoFilms. Refresh home page.";
    ev.target.reset();
  } catch (e) { uploadStatus.textContent = "Ikosa: " + e.message; }
  finally { btn.disabled = false; }
};
</script>
</body></html>
